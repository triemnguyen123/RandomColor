name: Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Update version in addon
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Update version in __init__.py
        sed -i "s/\"version\": ([0-9, ]*)/\"version\": (${VERSION//./, })/" random_color_addon/__init__.py
        # Update version in updater
        sed -i "s/self.current_version = ([0-9, ]*)/self.current_version = (${VERSION//./, })/" random_color_addon/core/updater.py
        
    - name: Create release package
      run: |
        mkdir -p release
        cp -r random_color_addon release/
        cd release
        zip -r RandomColor-v${{ steps.version.outputs.version }}.zip random_color_addon/
        
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Random Color v${{ steps.version.outputs.version }}
        body: |
          ## Random Color v${{ steps.version.outputs.version }}
          
          ### Features
          - Assign random colors to selected faces
          - Clear random colors from selected faces
          - Create FaceSets for sculpting
          - Material management utilities
          - Auto-update system
          
          ### Installation
          1. Download `RandomColor-v${{ steps.version.outputs.version }}.zip`
          2. Install in Blender: Edit > Preferences > Add-ons > Install
          3. Enable "Random Color" add-on
          
          ### Usage
          - Select faces in Edit mode
          - Use "Random Color Selected Faces" to assign random colors
          - Use "Clear Random Color Selected Faces" to remove colors
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release/RandomColor-v${{ steps.version.outputs.version }}.zip
        asset_name: RandomColor-v${{ steps.version.outputs.version }}.zip
        asset_content_type: application/zip
